<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Controller</title>
<style>
body {
  font-family: Arial;
  background: #222;
  color: white;
  margin: 0;
  padding: 0;
  overflow: hidden;
  transform: scale(0.5);
  transform-origin: top left;
  width: 200%;
  height: 200%;
}

#topBar {
  text-align: center;
  padding: 10px;
}

#connectBtn {
  background: #4CAF50;
  width: 200px;
  height: 60px;
  font-size: 24px;
  border-radius: 10px;
  border: none;
}

#container {
  display: flex;
  flex-direction: row;
  height: calc(100vh - 80px);
}

/* Joystick area */
#joystickArea {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

#joyCircle {
  width: 300px;
  height: 300px;
  background: #444;
  border-radius: 50%;
  position: relative;
  touch-action: none;
}

#stick {
  width: 90px;
  height: 90px;
  background: #888;
  border-radius: 50%;
  position: absolute;
  left: 105px;
  top: 105px;
}

/* Button grid */
#buttonArea {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-gap: 6px;
  padding: 12px;
}

.btn {
  background: #1e90ff;
  font-size: 18px;       /* 50% */
  border-radius: 12px;   /* 50% */
  border: none;
  height: 60px;          /* 50% */
  width: 120px;          /* 50% af ca. 240px */
}
</style>
</head>

<body>

<div id="topBar">
  <button id="connectBtn">Connect</button>
</div>

<div id="container">

  <!-- Left: Joystick -->
  <div id="joystickArea">
    <div id="joyCircle">
      <div id="stick"></div>
    </div>
  </div>

  <!-- Right: Buttons -->
  <div id="buttonArea">
    <button class="btn" onclick="sendButton('A')">A</button>
    <button class="btn" onclick="sendButton('B')">B</button>
    <button class="btn" onclick="sendButton('C')">C</button>
    <button class="btn" onclick="sendButton('D')">D</button>
  </div>

</div>

<script>
let device, server, service, characteristic;

// BLE connect
document.getElementById("connectBtn").onclick = async () => {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "ESP32" }],
      optionalServices: ["00001234-0000-1000-8000-00805f9b34fb"]
    });

    server = await device.gatt.connect();
    service = await server.getPrimaryService("00001234-0000-1000-8000-00805f9b34fb");
    characteristic = await service.getCharacteristic("0000abcd-0000-1000-8000-00805f9b34fb");

    alert("Connected!");
  } catch (e) {
    alert("Connection failed: " + e);
  }
};

// Send button command
function sendButton(cmd) {
  if (!characteristic) return;
  let data = new TextEncoder().encode("B:" + cmd);
  characteristic.writeValue(data);
}

// Joystick logic
let joyCircle = document.getElementById("joyCircle");
let stick = document.getElementById("stick");

let centerX = 150;
let centerY = 150;

joyCircle.addEventListener("pointermove", (e) => {
  if (e.pressure === 0) return;

  let rect = joyCircle.getBoundingClientRect();
  let x = e.clientX - rect.left;
  let y = e.clientY - rect.top;

  let dx = x - centerX;
  let dy = y - centerY;

  let dist = Math.sqrt(dx*dx + dy*dy);
  let maxDist = 120;

  if (dist > maxDist) {
    dx = dx * (maxDist / dist);
    dy = dy * (maxDist / dist);
  }

  stick.style.left = (centerX + dx - 45) + "px";
  stick.style.top = (centerY + dy - 45) + "px";

  sendJoystick(Math.round(dx), Math.round(dy));
});

joyCircle.addEventListener("pointerup", () => {
  stick.style.left = "105px";
  stick.style.top = "105px";
  sendJoystick(0, 0);
});

function sendJoystick(x, y) {
  if (!characteristic) return;
  let data = new TextEncoder().encode("J:" + x + "," + y);
  characteristic.writeValue(data);
}
</script>

</body>
</html>

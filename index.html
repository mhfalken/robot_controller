<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Controller</title>
<style>
body {
  font-family: Arial;
  background: #222;
  color: white;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

/* Top bar */
#topBar {
  text-align: center;
  padding: 10px;
}

#connectBtn {
  background: #4CAF50;
  width: 160px;
  height: 50px;
  font-size: 20px;
  border-radius: 10px;
  border: none;
}

/* Main layout */
#container {
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  gap: 20px;
  height: calc(100vh - 80px);
}

/* Joystick */
#joyCircle {
  width: 150px;
  height: 150px;
  background: #444;
  border-radius: 50%;
  position: relative;
  touch-action: none;
}

#stick {
  width: 45px;
  height: 45px;
  background: #888;
  border-radius: 50%;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

/* Buttons */
#buttonArea {
  width: 200px;
  display: grid;
  grid-template-columns: 90px 90px;
  grid-gap: 10px;
  justify-content: center;
  align-content: center;
}

.btn {
  background: #1e90ff;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  height: 45px;
  width: 90px;
}
</style>
</head>

<body>

<div id="topBar">
  <button id="connectBtn">Connect</button>
</div>

<div id="container">

  <!-- Joystick -->
  <div id="joyCircle">
    <div id="stick"></div>
  </div>

  <!-- Buttons -->
  <div id="buttonArea">
    <button class="btn" onclick="sendButton('A')">A</button>
    <button class="btn" onclick="sendButton('B')">B</button>
    <button class="btn" onclick="sendButton('C')">C</button>
    <button class="btn" onclick="sendButton('D')">D</button>
  </div>

</div>

<script>
let device, server, service, characteristic;

/* BLE connect */
document.getElementById("connectBtn").onclick = async () => {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "ESP32" }],
      optionalServices: ["00001234-0000-1000-8000-00805f9b34fb"]
    });

    server = await device.gatt.connect();
    service = await server.getPrimaryService("00001234-0000-1000-8000-00805f9b34fb");
    characteristic = await service.getCharacteristic("0000abcd-0000-1000-8000-00805f9b34fb");

    alert("Connected!");
  } catch (e) {
    alert("Connection failed: " + e);
  }
};

function sendButton(cmd) {
  if (!characteristic) return;
  let data = new TextEncoder().encode("B:" + cmd);
  characteristic.writeValue(data);
}

/* Joystick logic – kun bevægelse, ingen 0,0 ved slip */
let joyCircle = document.getElementById("joyCircle");
let stick = document.getElementById("stick");

function sendJoystick(x, y) {
  if (!characteristic) return;
  let data = new TextEncoder().encode("J:" + x + "," + y);
  characteristic.writeValue(data);
}

joyCircle.addEventListener("pointermove", (e) => {
  if (e.pressure === 0) return;

  let rect = joyCircle.getBoundingClientRect();
  let x = e.clientX - rect.left;
  let y = e.clientY - rect.top;

  let radius = rect.width / 2;
  let dx = x - radius;
  let dy = y - radius;

  let dist = Math.sqrt(dx*dx + dy*dy);
  let maxDist = radius - stick.offsetWidth / 2;

  if (dist > maxDist) {
    dx = dx * (maxDist / dist);
    dy = dy * (maxDist / dist);
  }

  stick.style.left = (radius + dx) + "px";
  stick.style.top  = (radius + dy) + "px";
  stick.style.transform = "translate(-50%, -50%)";

  sendJoystick(Math.round(dx), Math.round(dy));
});

joyCircle.addEventListener("pointerup", () => {
  // kun grafisk tilbage til midten, ingen 0,0 sendes
  stick.style.left = "50%";
  stick.style.top = "50%";
  stick.style.transform = "translate(-50%, -50%)";
});
</script>

</body>
</html>

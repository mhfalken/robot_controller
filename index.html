<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Controller</title>
<style>
body {
  font-family: Arial;
  background: #222;
  color: white;
  margin: 0;
  padding: 0;
  overflow: hidden;
  transform: scale(0.5);
  transform-origin: top left;
  width: 200%;
  height: 200%;
}

#topBar {
  text-align: center;
  padding: 10px;
}

#connectBtn {
  background: #4CAF50;
  width: 200px;
  height: 60px;
  font-size: 24px;
  border-radius: 10px;
  border: none;
}

#container {
  display: flex;
  flex-direction: row;
  height: calc(100vh - 80px);
  justify-content: center;
  align-items: center;
}

/* Joystick area */
#joystickArea {
  width: 300px;       /* fast bredde */
  display: flex;
  justify-content: center;
  align-items: center;
}

#joyCircle {
  width: 300px;
  height: 300px;
  background: #444;
  border-radius: 50%;
  position: relative;
  touch-action: none;
}

#stick {
  width: 90px;
  height: 90px;
  background: #888;
  border-radius: 50%;
  position: absolute;
  left: 105px;
  top: 105px;
}

/* Button grid */
#buttonArea {
  width: 260px;       /* fast bredde */
  display: grid;
  grid-template-columns: 120px 120px;
  grid-gap: 10px;
  justify-content: center;
  align-content: center;
  padding: 10px;
}

.btn {
  background: #1e90ff;
  font-size: 18px;
  border-radius: 12px;
  border: none;
  height: 60px;
  width: 120px;              /* fast bredde */
}
</style>
</head>

<body>

<div id="topBar">
  <button id="connectBtn">Connect</button>
</div>

<div id="container">

  <!-- Left: Joystick -->
  <div id="joystickArea">
    <div id="joyCircle">
      <div id="stick"></div>
    </div>
  </div>

  <!-- Right: Buttons -->
  <div id="buttonArea">
    <button class="btn" onclick="sendButton('A')">A</button>
    <button class="btn" onclick="sendButton('B')">B</button>
    <button class="btn" onclick="sendButton('C')">C</button>
    <button class="btn" onclick="sendButton('D')">D</button>
  </div>

</div>

<script>
let device, server, service, characteristic;

// BLE connect
document.getElementById("connectBtn").onclick = async () => {
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "ESP32" }],
      optionalServices: ["00001234-0000-1000-8000-00805f9b34fb"]
    });

    server = await device.gatt.connect();
    service = await server.getPrimaryService("00001234-0000-1000-8000-00805f9b34fb");
    characteristic = await service.getCharacteristic("0000abcd-0000-1000-8000-00805f9b34fb");

    alert("Connected!");
  } catch (e) {
    alert("Connection failed: " + e);
  }
};

// Send button command
function sendButton(cmd) {
  if (!characteristic) return;
  let data = new TextEncoder().encode("B:" + cmd);
  characteristic.writeValue(data);
}

// Joystick logic
let joyCircle = document.getElementById("joyCircle");
let stick = document.getElementById("stick");

function getJoystickMetrics() {
  let rect = joyCircle.getBoundingClientRect();
  let radius = rect.width / 2;
  return {
    rect: rect,
    centerX: rect.left + radius,
    centerY: rect.top + radius,
    radius: radius
  };
}

joyCircle.addEventListener("pointermove", (e) => {
  if (e.pressure === 0) return;

  let m = getJoystickMetrics();

  let dx = e.clientX - m.centerX;
  let dy = e.clientY - m.centerY;

  let dist = Math.sqrt(dx*dx + dy*dy);

  if (dist > m.radius) {
    dx = dx * (m.radius / dist);
    dy = dy * (m.radius / dist);
  }

  stick.style.left = (m.radius + dx - stick.offsetWidth/2) + "px";
  stick.style.top  = (m.radius + dy - stick.offsetHeight/2) + "px";

  sendJoystick(Math.round(dx), Math.round(dy));
});

joyCircle.addEventListener("pointerup", () => {
  let m = getJoystickMetrics();
  stick.style.left = (m.radius - stick.offsetWidth/2) + "px";
  stick.style.top  = (m.radius - stick.offsetHeight/2) + "px";
  sendJoystick(0, 0);
});

</script>

</body>
</html>
